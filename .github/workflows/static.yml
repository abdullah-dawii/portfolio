# Check the site (HTML, links, Lighthouse), then deploy to GitHub Pages only if checks pass
name: Deploy static content to Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      perf: ${{ steps.lh.outputs.perf }}
      a11y: ${{ steps.lh.outputs.a11y }}
      bp: ${{ steps.lh.outputs.bp }}
      seo: ${{ steps.lh.outputs.seo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes html-validate@8 index.html

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude '^mailto:'
            --exclude 'linkedin\.com'
            --exclude 'wa\.me'
            --exclude 'fonts\.(googleapis|gstatic)\.com'
            --exclude 'abdullah-dawii\.github\.io'
            index.html
          fail: true

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Read Lighthouse scores
        id: lh
        run: |
          f=$(ls .lighthouseci/lhr-*.json | head -1)
          for k in performance:perf accessibility:a11y best-practices:bp seo:seo; do
            echo "${k#*:}=$(jq ".categories[\"${k%%:*}\"].score*100|round" "$f")" >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI status into footer
        env:
          PERF: ${{ needs.check.outputs.perf }}
          A11Y: ${{ needs.check.outputs.a11y }}
          BP: ${{ needs.check.outputs.bp }}
          SEO: ${{ needs.check.outputs.seo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          line="<p class=\"ci-line\"><a href=\"$RUN_URL\" target=\"_blank\"><span class=\"ok\"></span>Build passing · deployed by GitHub Actions</a><span>Lighthouse: Performance <b>$PERF</b> · Accessibility <b>$A11Y</b> · Best Practices <b>$BP</b> · SEO <b>$SEO</b></span><span>commit ${SHA::7}</span></p>"
          python3 - "$line" <<'PY'
          import sys
          p = 'index.html'
          s = open(p).read()
          assert '<!--CI-STATUS-->' in s
          open(p, 'w').write(s.replace('<!--CI-STATUS-->', sys.argv[1]))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
